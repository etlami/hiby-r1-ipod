# Zeilen für /usr/data/bidhata-menu.conf (Bootmenü des bidhata-Mods).
# Die erste Zeile ersetzt den normalen "HIBY PLAYER"-Eintrag oben im Menü.
# "run|player" ist nötig, damit das Menü den Countdown anzeigt; der Wrapper
# (/usr/data/bidhata-menu) leitet diese Wahl auf ipodplayer.sh um.
HIBY PLAYER + IPOD|PLAYER|run|player|
HIBY PLAYER|PLAYER|run|/usr/data/hibyplayer.sh|
